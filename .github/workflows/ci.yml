name: ChuriCanvas CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_EMAIL: ci@churicanvas.test
      ADMIN_PASSWORD: ci-verification-only-password
      SESSION_SECRET: ci-verification-only-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify the complete order pipeline
        run: |
          npm run start > /tmp/churicanvas.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          READY=false
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/api/session > /dev/null; then
              READY=true
              break
            fi
            sleep 1
          done
          if [ "$READY" != true ]; then
            cat /tmp/churicanvas.log
            exit 1
          fi
          npm run test:e2e
